<!DOCTYPE html>
<!--
    Program name: patient-form.html
    Author: Myles Carpenter
    Date created: 02/02/2026
    Date last edited: 03/27/2026
    Version: 2.0
    Description: Patient registration form with review section and validation.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body onload="showDate(); setDateLimits(); updateHealthValue();">

    <div id="header">
        <img src="logo.png" alt="Medical Logo" id="logo">
        <h1>Magic Myles Medical</h1>
        <p>Today is: <span id="today"></span></p>
    </div>

    <form id="patientForm" action="thankyou.html" onsubmit="return validateForm();">
        <table>

            <tr>
                <td>Name</td>
                <td class="name-row">
                    <label for="firstName">First</label>
                    <input type="text" id="firstName" name="firstName" maxlength="30" minlength="1"
                        pattern="[A-Za-z'-]{1,30}"
                        title="First name must be 1 to 30 characters and contain letters, apostrophes, or dashes only."
                        required>

                    <label for="middleInitial">MI</label>
                    <input type="text" id="middleInitial" name="middleInitial" maxlength="1"
                        pattern="[A-Za-z]?"
                        title="Middle initial must be one letter only or left blank.">

                    <label for="lastName">Last</label>
                    <input type="text" id="lastName" name="lastName" maxlength="30" minlength="1"
                        pattern="[A-Za-z0-9'-]{1,30}"
                        title="Last name must be 1 to 30 characters and can include letters, apostrophes, dashes, or numbers."
                        required>
                </td>
            </tr>

            <tr>
                <td>Date of Birth</td>
                <td>
                    <input type="date" id="dob" name="dob"
                        title="Enter your date of birth. It cannot be in the future or more than 120 years ago."
                        required>
                </td>
            </tr>

            <tr>
                <td>ID Number</td>
                <td>
                    <input type="password" id="idNumber" name="idNumber" maxlength="11"
                        pattern="^\d{3}-?\d{2}-?\d{4}$"
                        title="Enter a 9 digit ID number, with or without dashes."
                        required>
                </td>
            </tr>

            <tr>
                <td>Email</td>
                <td>
                    <input type="email" id="email" name="email"
                        title="Enter a valid email in the format name@domain.tld."
                        required>
                </td>
            </tr>

            <tr>
                <td>Phone</td>
                <td>
                    <input type="tel" id="phone" name="phone"
                        pattern="^\d{3}-\d{3}-\d{4}$"
                        placeholder="000-000-0000"
                        title="Enter phone number in the format 000-000-0000."
                        required>
                </td>
            </tr>

            <tr>
                <td>Address</td>
                <td>
                    <input type="text" id="addr1" name="addr1" maxlength="30" minlength="2"
                        title="Address Line 1 must be 2 to 30 characters."
                        required><br>

                    <input type="text" id="addr2" name="addr2" maxlength="30" minlength="2"
                        title="Address Line 2 is optional, but if entered it should be 2 to 30 characters.">
                </td>
            </tr>

            <tr>
                <td>City State Zip</td>
                <td>
                    <input type="text" id="city" name="city" maxlength="30" minlength="2"
                        title="City must be 2 to 30 characters."
                        required>

                    <select id="state" name="state"
                        title="Choose a valid state."
                        required>
                        <option value="">Select State</option>
                        <option>AL</option><option>AK</option><option>AZ</option><option>AR</option>
                        <option>CA</option><option>CO</option><option>CT</option><option>DE</option>
                        <option>DC</option><option>FL</option><option>GA</option><option>HI</option>
                        <option>ID</option><option>IL</option><option>IN</option><option>IA</option>
                        <option>KS</option><option>KY</option><option>LA</option><option>ME</option>
                        <option>MD</option><option>MA</option><option>MI</option><option>MN</option>
                        <option>MS</option><option>MO</option><option>MT</option><option>NE</option>
                        <option>NV</option><option>NH</option><option>NJ</option><option>NM</option>
                        <option>NY</option><option>NC</option><option>ND</option><option>OH</option>
                        <option>OK</option><option>OR</option><option>PA</option><option>PR</option>
                        <option>RI</option><option>SC</option><option>SD</option><option>TN</option>
                        <option>TX</option><option>UT</option><option>VT</option><option>VA</option>
                        <option>WA</option><option>WV</option><option>WI</option><option>WY</option>
                    </select>

                    <input type="text" id="zip" name="zip" maxlength="10"
                        pattern="^\d{5}(-\d{4})?$"
                        placeholder="12345 or 12345-6789"
                        title="Enter a 5 digit zip code or zip plus 4."
                        required>
                </td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" id="genderMale" name="gender" value="Male" required>
                    <label for="genderMale">Male</label>

                    <input type="radio" id="genderFemale" name="gender" value="Female">
                    <label for="genderFemale">Female</label>

                    <input type="radio" id="genderOther" name="gender" value="Other">
                    <label for="genderOther">Other</label>
                </td>
            </tr>

            <tr>
                <td>Vaccinated</td>
                <td>
                    <input type="radio" id="vaccinatedYes" name="vaccinated" value="Yes" required>
                    <label for="vaccinatedYes">Yes</label>

                    <input type="radio" id="vaccinatedNo" name="vaccinated" value="No">
                    <label for="vaccinatedNo">No</label>
                </td>
            </tr>

            <tr>
                <td>Insurance</td>
                <td>
                    <input type="radio" id="insuranceYes" name="insurance" value="Yes" required>
                    <label for="insuranceYes">Yes</label>

                    <input type="radio" id="insuranceNo" name="insurance" value="No">
                    <label for="insuranceNo">No</label>
                </td>
            </tr>

            <tr>
                <td>Medical History</td>
                <td>
                    <input type="checkbox" id="chickenPox" name="history" value="Chicken Pox">
                    <label for="chickenPox">Chicken Pox</label>

                    <input type="checkbox" id="measles" name="history" value="Measles">
                    <label for="measles">Measles</label>

                    <input type="checkbox" id="covid19" name="history" value="Covid-19">
                    <label for="covid19">Covid-19</label>

                    <input type="checkbox" id="tetanus" name="history" value="Tetanus">
                    <label for="tetanus">Tetanus</label>

                    <input type="checkbox" id="flu" name="history" value="Flu">
                    <label for="flu">Flu</label>
                </td>
            </tr>

            <tr>
                <td>Health Rating</td>
                <td>
                    <input type="range" id="healthRating" name="healthRating" min="1" max="10" value="5"
                        oninput="updateHealthValue()"
                        title="Slide from 1 to 10 to rate your health.">
                    <span id="healthValue">5</span>
                </td>
            </tr>

            <tr>
                <td>Symptoms</td>
                <td>
                    <textarea id="symptoms" name="symptoms" rows="3" cols="50"
                        title="Optional. Describe your symptoms."></textarea>
                </td>
            </tr>

            <tr>
                <td>User ID</td>
                <td>
                    <input type="text" id="userId" name="userId" maxlength="30" minlength="5"
                        pattern="^[A-Za-z][A-Za-z0-9_-]{4,29}$"
                        title="User ID must be 5 to 30 characters, start with a letter, contain no spaces, and only use letters, numbers, underscores, or dashes."
                        oninput="forceLowercaseUserId()"
                        required>
                </td>
            </tr>

            <tr>
                <td>Password</td>
                <td>
                    <input type="password" id="password" name="password" maxlength="30" minlength="8"
                        pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#%^&*()\-_=+\\\/><.,`~])(?!.*&quot;).{8,30}$"
                        title="Password must be 8 to 30 characters and include an uppercase letter, lowercase letter, number, and special character. Do not use quotes."
                        required><br>

                    <input type="password" id="confirmPassword" name="confirmPassword" maxlength="30" minlength="8"
                        title="Re enter the same password."
                        required>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="button" value="Review" onclick="reviewForm()">
                    <input type="submit" value="Submit">
                    <input type="reset" value="START OVER" onclick="clearReview()">
                </td>
            </tr>

        </table>
    </form>

    <div id="reviewSection">
        <h2>PLEASE REVIEW THIS INFORMATION</h2>
        <div id="reviewContent">No information reviewed yet.</div>
    </div>

    <div id="footer">
        <button type="button">Contact Us</button>
        <p>Magic Myles Medical | Sandy Hills TX</p>
    </div>

</body>
</html>
